<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trail Ready — Backpacking Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inconsolata:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d1710;
    --bg2: #111f14;
    --bg3: #162019;
    --surface: #1a2b1d;
    --surface2: #203325;
    --border: rgba(90,140,80,0.18);
    --border2: rgba(90,140,80,0.32);
    --green: #5a8c50;
    --green-bright: #7ab86e;
    --green-pale: #a8d49c;
    --gold: #c9a84c;
    --gold-pale: #e2cc94;
    --text: #d4e8cd;
    --text2: #8fad88;
    --text3: #506b4a;
    --fog: rgba(13,23,16,0.85);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inconsolata', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Noise texture overlay ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }

  /* ── Hero Header ── */
  .hero {
    position: relative;
    width: 100%;
    overflow: hidden;
    padding: 0;
  }

  .hero svg.treeline {
    display: block;
    width: 100%;
    height: auto;
  }

  .hero-content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
    padding: 2rem;
  }

  .hero-eyebrow {
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--green);
    margin-bottom: 0.75rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.3s forwards;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 4rem);
    font-weight: 600;
    color: var(--text);
    text-align: center;
    line-height: 1.15;
    letter-spacing: -0.01em;
    opacity: 0;
    animation: fadeUp 0.8s 0.5s forwards;
  }

  .hero-title span {
    color: var(--gold);
  }

  .hero-sub {
    font-size: 12px;
    letter-spacing: 0.18em;
    color: var(--text2);
    margin-top: 0.9rem;
    opacity: 0;
    animation: fadeUp 0.8s 0.7s forwards;
  }

  /* ── Progress Bar ── */
  .progress-wrap {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 14px 2rem;
    flex-wrap: wrap;
  }

  .progress-track {
    flex: 1;
    min-width: 140px;
    height: 4px;
    background: var(--bg3);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--green), var(--green-bright));
    border-radius: 99px;
    transition: width 0.4s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }

  .progress-label {
    font-size: 12px;
    color: var(--text2);
    letter-spacing: 0.1em;
    white-space: nowrap;
  }

  .progress-pct {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    color: var(--green-pale);
    min-width: 46px;
    text-align: right;
  }

  .reset-btn {
    font-family: 'Inconsolata', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text3);
    background: transparent;
    border: 1px solid var(--border);
    padding: 5px 14px;
    border-radius: 3px;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }

  .reset-btn:hover { color: var(--text2); border-color: var(--border2); }

  /* ── Main Layout ── */
  .main {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 4rem;
  }

  /* ── Category Section ── */
  .section {
    margin-bottom: 1.25rem;
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--surface);
    opacity: 0;
    transform: translateY(14px);
    animation: fadeUp 0.5s forwards;
  }

  .section:nth-child(1) { animation-delay: 0.1s; }
  .section:nth-child(2) { animation-delay: 0.17s; }
  .section:nth-child(3) { animation-delay: 0.24s; }
  .section:nth-child(4) { animation-delay: 0.31s; }
  .section:nth-child(5) { animation-delay: 0.38s; }
  .section:nth-child(6) { animation-delay: 0.45s; }
  .section:nth-child(7) { animation-delay: 0.52s; }
  .section:nth-child(8) { animation-delay: 0.59s; }
  .section:nth-child(9) { animation-delay: 0.66s; }
  .section:nth-child(10) { animation-delay: 0.73s; }

  .section-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
    transition: background 0.2s;
  }

  .section-header:hover { background: var(--surface2); }

  .section-icon {
    font-size: 18px;
    width: 22px;
    text-align: center;
    flex-shrink: 0;
  }

  .section-name {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    color: var(--text);
    flex: 1;
    letter-spacing: 0.01em;
  }

  .section-tally {
    font-size: 11px;
    color: var(--text3);
    letter-spacing: 0.12em;
    transition: color 0.3s;
  }

  .section-tally.complete { color: var(--green); }

  .section-chevron {
    font-size: 11px;
    color: var(--text3);
    transition: transform 0.25s;
  }

  .section-chevron.open { transform: rotate(180deg); }

  /* ── Items Grid ── */
  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    padding: 8px;
    gap: 2px;
  }

  .item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .item:hover { background: var(--surface2); }

  /* Custom checkbox */
  .item input[type=checkbox] { display: none; }

  .cb-box {
    width: 15px;
    height: 15px;
    border: 1px solid var(--text3);
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, background 0.2s;
  }

  .cb-box::after {
    content: '';
    width: 8px;
    height: 5px;
    border-left: 1.5px solid var(--bg);
    border-bottom: 1.5px solid var(--bg);
    transform: rotate(-45deg) translateY(-1px);
    opacity: 0;
    transition: opacity 0.15s;
  }

  .item.checked .cb-box {
    background: var(--green);
    border-color: var(--green);
  }

  .item.checked .cb-box::after { opacity: 1; }

  .item-label {
    font-size: 13px;
    color: var(--text2);
    line-height: 1.45;
    transition: color 0.2s;
  }

  .item.checked .item-label {
    color: var(--text3);
    text-decoration: line-through;
    text-decoration-color: var(--text3);
  }

  .opt-tag {
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--gold);
    border: 1px solid rgba(201,168,76,0.3);
    border-radius: 2px;
    padding: 1px 5px;
    flex-shrink: 0;
    margin-top: 3px;
  }

  /* ── Footer ── */
  .footer {
    text-align: center;
    padding: 2rem 1rem 3rem;
    position: relative;
    z-index: 1;
  }

  .footer-trees {
    display: block;
    width: 100%;
    max-width: 500px;
    margin: 0 auto 1rem;
    opacity: 0.25;
  }

  .footer-text {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text3);
  }

  /* ── Animations ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Mobile ── */
  @media (max-width: 540px) {
    .items-grid { grid-template-columns: 1fr 1fr; }
    .hero-content { padding: 1.25rem; }
  }
</style>
</head>
<body>

<!-- ══ HERO ══ -->
<div class="hero">
  <svg class="treeline" viewBox="0 0 1440 320" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">

    <polygon points="0,260 120,180 280,230 440,155 600,210 760,148 940,200 1100,145 1260,195 1440,155 1440,320 0,320" fill="#0f1f12"/>

    <g fill="#0e1c11">

      <polygon points="0,320 30,240 60,320"/>

    <!-- Tree line — front row (darker, taller) -->
    <g fill="#0a1509">
      <polygon points="0,320 40,225 80,320"/>

      <polygon points="140,320 182,200 224,320"/>

    <!-- Ground fog -->

  <div class="hero-content">
    <p class="hero-eyebrow">Mild-Weather</p>
    <h1 class="hero-title">Trail <span>Ready</span></h1>

</div>

<!-- ══ PROGRESS ══ -->
<div class="progress-wrap">
  <div class="progress-track">
    <div class="progress-fill" id="pbar"></div>
  </div>
  <span class="progress-pct" id="ppct">0%</span>
  <span class="progress-label" id="plabel">0 / 0 items packed</span>
  <button class="reset-btn" onclick="resetAll()">↺ Reset</button>
</div>

<!-- ══ CHECKLIST ══ -->
<main class="main" id="sections"></main>

<!-- ══ FOOTER ══ -->
<footer class="footer">
  <svg class="footer-trees" viewBox="0 0 500 80" xmlns="http://www.w3.org/2000/svg">
    <g fill="#3a6040">
      <polygon points="0,80 25,30 50,80"/><polygon points="10,80 25,42 40,80"/>
      <polygon points="40,80 68,22 96,80"/><polygon points="52,80 68,36 84,80"/>
      <polygon points="90,80 120,18 150,80"/><polygon points="104,80 120,32 136,80"/>
      <polygon points="148,80 178,24 208,80"/><polygon points="162,80 178,38 194,80"/>
      <polygon points="310,80 340,24 370,80"/><polygon points="324,80 340,38 356,80"/>
      <polygon points="362,80 394,18 426,80"/><polygon points="378,80 394,32 410,80"/>
      <polygon points="416,80 448,22 480,80"/><polygon points="432,80 448,36 464,80"/>
      <polygon points="468,80 500,28 500,80"/>
    </g>
  </svg>
  <p class="footer-text">Leave no trace &nbsp;·&nbsp; Pack it in, pack it out</p>
</footer>

<script>
const data = [
  { name: "Clothing", icon: "👕",
    items: [
      {l:"Light shell jacket"},{l:"Shell pants",o:true},{l:"Thermal short sleeves"},
      {l:"Thermal long sleeve"},{l:"Thermal pants"},{l:"Socks"},
      {l:"Hiking shorts"},{l:"Underwear"},{l:"Camp shoes"},
      {l:"Under shorts (supportive)"},{l:"Ball cap / sun hat"},
      {l:"Bandana(s)"},{l:"Chamois towel",o:true},{l:"Stuff sack with clothes"}
    ]
  },
  { name: "Shelter & Sleep", icon: "⛺",
    items: [
      {l:"Tent"},{l:"Sleeping pad(s)"},{l:"Sleeping bag"},
      {l:"Ground blanket"},{l:"Hammock"},{l:"Trekking poles"}
    ]
  },
  { name: "Safety & Navigation", icon: "🧭",
    items: [
      {l:"Whistle (included with pack)"},{l:"First-aid kit / emergency blanket"},
      {l:"Compass"},{l:"Map"},{l:"Head lamp"},
      {l:"Spare laces",o:true},{l:"Rope for hanging food bag"}
    ]
  },
  { name: "Hygiene & Leave No Trace", icon: "🌿",
    items: [
      {l:"Toilet paper"},{l:"Trowel"},{l:"Garbage bags"},
      {l:"Zip-loc bags"},{l:"Hand sanitizer"},{l:"Wipes for cleaning"},
      {l:"Tooth products"},{l:"Deodorant"},{l:"Rose water"},
      {l:"Moisturizer"}
    ]
  },
  { name: "Sun, Bug & Skin", icon: "☀️",
    items: [
      {l:"Sunscreen"},{l:"Bug spray"},{l:"Lip balm"},
      {l:"Sunglasses"},{l:"Beach towel",o:true}
    ]
  },
  { name: "Water", icon: "💧",
    items: [
      {l:"Water bottles / bladder"},{l:"Water purification"},
      {l:"Backup bladder"},{l:"Duct-taped Nalgene"}
    ]
  },
  { name: "Kitchen & Food", icon: "🔥",
    items: [
      {l:"Jet Boil"},{l:"Backup fuel cartridge"},{l:"Titanium pots",o:true},
      {l:"Cook set",o:true},{l:"Sporks ×2"},{l:"Titanium cup"},
      {l:"BH and porta-flask"},{l:"Meals"},{l:"Other food stuffs"},
      {l:"Oysters / pulpo"},{l:"Honey Stinger"},{l:"Chocolate"},
      {l:"Coffee"},{l:"Wine key"},{l:"Foil"},
      {l:"Car cooler"},{l:"Lighter / matches + fire starter"}
    ]
  },
  { name: "Health & Medicine", icon: "💊",
    items: [
      {l:"Medicine"},{l:"Delta-9 THC"}
    ]
  },
  { name: "Tech & Tools", icon: "🔦",
    items: [
      {l:"Solar charger"},{l:"Camera",o:true},{l:"Saw"},{l:"Notebook"}
    ]
  },
  { name: "Entertainment & Misc", icon: "🃏",
    items: [
      {l:"Entertainment (cards, book, etc.)"},{l:"Duct tape"}
    ]
  }
];

let checks = {};
let collapsed = {};

function totalItems() { return data.reduce((s,c)=>s+c.items.length,0); }
function totalChecked() { return Object.values(checks).filter(Boolean).length; }

function updateProgress() {
  const total = totalItems(), done = totalChecked();
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('ppct').textContent = pct + '%';
  document.getElementById('plabel').textContent = done + ' / ' + total + ' items packed';
}

function render() {
  const cont = document.getElementById('sections');
  cont.innerHTML = '';
  data.forEach((cat, ci) => {
    const isOpen = !collapsed[ci];
    const done = cat.items.filter((_,ii) => checks[ci+'_'+ii]).length;
    const allDone = done === cat.items.length;

    const sec = document.createElement('div');
    sec.className = 'section';
    sec.style.animationDelay = (0.08 + ci * 0.07) + 's';

    sec.innerHTML = `
      <div class="section-header" onclick="toggleSection(${ci})">
        <span class="section-icon">${cat.icon}</span>
        <span class="section-name">${cat.name}</span>
        <span class="section-tally${allDone?' complete':''}">${done}/${cat.items.length}</span>
        <span class="section-chevron${isOpen?' open':''}">▼</span>
      </div>
      ${isOpen ? `<div class="items-grid">${cat.items.map((it,ii)=>{
        const id = ci+'_'+ii;
        const checked = !!checks[id];
        return `<div class="item${checked?' checked':''}" onclick="toggle('${id}')">
          <input type="checkbox" ${checked?'checked':''}>
          <div class="cb-box"></div>
          <span class="item-label">${it.l}</span>
          ${it.o?'<span class="opt-tag">opt</span>':''}
        </div>`;
      }).join('')}</div>` : ''}
    `;
    cont.appendChild(sec);
  });
  updateProgress();
}

function toggleSection(ci) {
  collapsed[ci] = !collapsed[ci];
  render();
}

function toggle(id) {
  checks[id] = !checks[id];
  render();
}

function resetAll() {
  if (confirm('Reset all items?')) {
    checks = {};
    render();
  }
}

render();
</script>
</body>
</html>
