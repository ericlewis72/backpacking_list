<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trail Ready — Backpacking Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inconsolata:wght@300;400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ════════════════════════════════
     DESKTOP — dark forest
  ════════════════════════════════ */
  :root {
    --bg: #0d1710;
    --bg2: #111f14;
    --bg3: #162019;
    --surface: #1a2b1d;
    --surface2: #203325;
    --border: rgba(90,140,80,0.18);
    --border2: rgba(90,140,80,0.32);
    --green: #5a8c50;
    --green-bright: #7ab86e;
    --green-pale: #a8d49c;
    --gold: #c9a84c;
    --text: #d4e8cd;
    --text2: #8fad88;
    --text3: #506b4a;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inconsolata', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.6;
  }


  /* ── Dual hero visibility ── */
  .mobile-hero { display: none; }
  .desktop-hero { display: block; }

  @media (max-width: 640px) {
    .mobile-hero { display: block; }
    .desktop-hero { display: none; }
    /* Title readable on light dawn sky */
    .hero-eyebrow { color: #2a6b38 !important; font-weight: 600; letter-spacing: 0.3em; text-shadow: none; }
    .hero-title { color: #1a2e1a !important; text-shadow: 0 1px 3px rgba(255,255,255,0.4); }
    .hero-title span { color: #7a4f10 !important; }
    .hero-sub { color: #3a5a3a !important; font-weight: 500; }
  }
  /* ── Hero ── */
  .hero { position: relative; width: 100%; overflow: hidden; }
  .hero svg.treeline { display: block; width: 100%; height: auto; }
  .hero-content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 2; padding: 2rem;
  }
  .hero-eyebrow {
    font-size: 11px; font-weight: 300; letter-spacing: 0.35em; text-transform: uppercase;
    color: var(--green); margin-bottom: 0.75rem;
    opacity: 0; animation: fadeUp 0.8s 0.3s forwards;
  }
  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.2rem, 5vw, 4rem); font-weight: 600;
    color: var(--text); text-align: center; line-height: 1.15;
    opacity: 0; animation: fadeUp 0.8s 0.5s forwards;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8), 0 0 40px rgba(0,0,0,0.6);
  }
  .hero-title span { color: var(--gold); }
  .hero-sub {
    font-size: 12px; letter-spacing: 0.18em; color: var(--text2); margin-top: 0.9rem;
    opacity: 0; animation: fadeUp 0.8s 0.7s forwards;
  }

  /* ── Progress ── */
  .progress-wrap {
    position: relative; z-index: 2;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: var(--surface);
    border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
    padding: 14px 2rem;
  }
  .progress-track {
    flex: 1; min-width: 140px; height: 4px;
    background: var(--bg3); border-radius: 99px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--green), var(--green-bright));
    border-radius: 99px; transition: width 0.4s cubic-bezier(.4,0,.2,1); width: 0%;
  }
  .progress-label { font-size: 12px; color: var(--text2); letter-spacing: 0.1em; white-space: nowrap; }
  .progress-pct { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--green-pale); min-width: 46px; text-align: right; }
  .reset-btn {
    font-family: 'Inconsolata', monospace; font-size: 11px; letter-spacing: 0.18em;
    text-transform: uppercase; color: var(--text3); background: transparent;
    border: 1px solid var(--border); padding: 5px 14px; border-radius: 3px; cursor: pointer;
    transition: color 0.2s, border-color 0.2s;
  }
  .reset-btn:hover { color: var(--text2); border-color: var(--border2); }

  /* ── Main ── */
  .main { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

  /* ── Sections ── */
  .section {
    margin-bottom: 1.25rem; border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden; background: var(--surface);
    opacity: 0; transform: translateY(14px); animation: fadeUp 0.5s forwards;
  }
  .section:nth-child(1){animation-delay:0.10s} .section:nth-child(2){animation-delay:0.17s}
  .section:nth-child(3){animation-delay:0.24s} .section:nth-child(4){animation-delay:0.31s}
  .section:nth-child(5){animation-delay:0.38s} .section:nth-child(6){animation-delay:0.45s}
  .section:nth-child(7){animation-delay:0.52s} .section:nth-child(8){animation-delay:0.59s}
  .section:nth-child(9){animation-delay:0.66s} .section:nth-child(10){animation-delay:0.73s}

  .section-header {
    display: flex; align-items: center; gap: 12px; padding: 12px 16px;
    cursor: pointer; user-select: none;
    border-bottom: 1px solid var(--border); background: var(--bg3); transition: background 0.2s;
  }
  .section-header:hover { background: var(--surface2); }
  .section-icon { font-size: 18px; width: 22px; text-align: center; flex-shrink: 0; }
  .section-name { font-family: 'Playfair Display', serif; font-size: 15px; color: var(--text); flex: 1; }
  .section-tally { font-size: 11px; color: var(--text3); letter-spacing: 0.12em; transition: color 0.3s; }
  .section-tally.complete { color: var(--green); }
  .section-chevron { font-size: 11px; color: var(--text3); transition: transform 0.25s; }
  .section-chevron.open { transform: rotate(180deg); }

  /* ── Items Grid ── */
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); padding: 8px; gap: 2px; }

  .item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 8px 10px; border-radius: 4px; cursor: pointer; transition: background 0.15s;
  }
  .item:hover { background: var(--surface2); }
  .item input[type=checkbox] { display: none; }
  .cb-box {
    width: 15px; height: 15px; border: 1px solid var(--text3); border-radius: 2px;
    flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background 0.2s;
  }
  .cb-box::after {
    content: ''; width: 8px; height: 5px;
    border-left: 1.5px solid var(--bg); border-bottom: 1.5px solid var(--bg);
    transform: rotate(-45deg) translateY(-1px); opacity: 0; transition: opacity 0.15s;
  }
  .item.checked .cb-box { background: var(--green); border-color: var(--green); }
  .item.checked .cb-box::after { opacity: 1; }
  .item-label { font-size: 13px; color: var(--text2); line-height: 1.45; transition: color 0.2s; }
  .item.checked .item-label { color: var(--text3); text-decoration: line-through; text-decoration-color: var(--text3); }
  .opt-tag {
    font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gold); border: 1px solid rgba(201,168,76,0.3);
    border-radius: 2px; padding: 1px 5px; flex-shrink: 0; margin-top: 3px;
  }

  /* ── Meals Sub-dropdown ── */
  .meals-wrap {
    grid-column: 1 / -1; border: 1px solid var(--border); border-radius: 5px;
    margin: 4px 2px 6px; overflow: hidden; background: var(--bg3);
  }
  .meals-header {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    cursor: pointer; user-select: none; transition: background 0.15s;
  }
  .meals-header:hover { background: var(--surface2); }
  .meals-title { font-size: 13px; color: var(--text2); flex: 1; }
  .meals-tally { font-size: 11px; color: var(--text3); letter-spacing: 0.1em; }
  .meals-tally.complete { color: var(--green); }
  .meals-chevron { font-size: 10px; color: var(--text3); transition: transform 0.2s; }
  .meals-chevron.open { transform: rotate(180deg); }
  .meals-list { padding: 4px 8px 8px; border-top: 1px solid var(--border); }
  .meal-item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 8px; border-radius: 4px; cursor: pointer; transition: background 0.15s;
  }
  .meal-item:hover { background: var(--surface2); }
  .meal-brand { font-size: 10px; letter-spacing: 0.1em; color: var(--gold); text-transform: uppercase; white-space: nowrap; flex-shrink: 0; }
  .meal-name { font-size: 13px; color: var(--text2); flex: 1; }
  .meal-rating { font-size: 11px; color: var(--green); white-space: nowrap; }
  .meal-item.checked .meal-name { color: var(--text3); text-decoration: line-through; }
  .meal-item.checked .cb-box { background: var(--green); border-color: var(--green); }
  .meal-item.checked .cb-box::after { opacity: 1; }

  /* ── Footer ── */
  .footer { text-align: center; padding: 2rem 1rem 3rem; position: relative; z-index: 1; }
  .footer-trees { display: block; width: 100%; max-width: 500px; margin: 0 auto 1rem; opacity: 0.25; }
  .footer-text { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text3); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ════════════════════════════════
     MOBILE — high contrast light mode
  ════════════════════════════════ */
  @media (max-width: 640px) {

    :root {
      --bg: #f5f2ec;
      --bg2: #ede9e0;
      --bg3: #e8e4da;
      --surface: #ffffff;
      --surface2: #f0ece3;
      --border: rgba(60,90,50,0.15);
      --border2: rgba(60,90,50,0.3);
      --green: #2a6b38;
      --green-bright: #3a8a4a;
      --green-pale: #1f5129;
      --gold: #8a6010;
      --text: #1a1a1a;
      --text2: #2d2d2d;
      --text3: #666666;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body::before { display: none; }

    /* Hero — compact on mobile */
    .hero svg.treeline { max-height: 160px; object-fit: cover; }
    .hero-eyebrow { font-size: 11px; color: #3a8a4a; letter-spacing: 0.25em; }
    .hero-title { font-size: 2rem; color: #1a1a1a; }
    .hero-title span { color: #8a6010; }
    .hero-sub { font-size: 12px; color: #444; }

    /* Hero SVG — invert to light for mobile */
    .hero svg.treeline rect { fill: #d4e8d4 !important; }

    /* Progress bar */
    .progress-wrap {
      background: #ffffff;
      border-top: 2px solid #2a6b38;
      border-bottom: 2px solid rgba(60,90,50,0.15);
      padding: 14px 1rem; gap: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .progress-track { background: #e0e0e0; height: 6px; }
    .progress-fill { background: linear-gradient(90deg, #2a6b38, #3a8a4a); }
    .progress-pct { font-size: 20px; font-weight: 700; color: #2a6b38; font-family: 'Inter', sans-serif; }
    .progress-label { font-size: 13px; color: #444; font-family: 'Inter', sans-serif; }
    .reset-btn {
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
      color: #c0392b; border-color: #c0392b; padding: 7px 14px; letter-spacing: 0;
    }

    /* Main layout */
    .main { padding: 1rem 0.75rem 3rem; }

    /* Sections */
    .section {
      margin-bottom: 0.75rem; border-radius: 10px;
      border: 1.5px solid rgba(60,90,50,0.18);
      background: #ffffff;
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }
    .section-header {
      background: #f8f6f1; padding: 16px 14px; min-height: 56px;
      border-bottom: 1.5px solid rgba(60,90,50,0.12);
    }
    .section-icon { font-size: 22px; width: 26px; }
    .section-name {
      font-family: 'Inter', sans-serif; font-size: 17px;
      font-weight: 600; color: #1a1a1a;
    }
    .section-tally { font-size: 13px; color: #888; font-weight: 500; }
    .section-tally.complete { color: #2a6b38; font-weight: 700; }
    .section-chevron { font-size: 13px; color: #888; }

    /* Items — single column, large tap targets */
    .items-grid { grid-template-columns: 1fr; padding: 6px 8px; gap: 2px; }

    .item {
      padding: 13px 12px; min-height: 52px; border-radius: 8px;
      align-items: center; gap: 14px;
    }
    .item:active { background: #eef5ec; }

    /* Large high-contrast checkbox */
    .cb-box {
      width: 24px; height: 24px; border: 2px solid #999; border-radius: 5px;
      flex-shrink: 0; margin-top: 0;
    }
    .cb-box::after {
      width: 13px; height: 8px;
      border-left: 2.5px solid #fff; border-bottom: 2.5px solid #fff;
    }
    .item.checked .cb-box { background: #2a6b38; border-color: #2a6b38; }

    .item-label {
      font-family: 'Inter', sans-serif; font-size: 16px;
      font-weight: 500; color: #1a1a1a; line-height: 1.35;
    }
    .item.checked .item-label { color: #999; text-decoration-color: #bbb; }

    .opt-tag {
      font-size: 10px; color: #8a6010; border-color: rgba(138,96,16,0.4);
      padding: 2px 7px; font-family: 'Inter', sans-serif; font-weight: 600;
    }

    /* Meals dropdown mobile */
    .meals-wrap { margin: 6px 0 4px; border-radius: 8px; border: 1.5px solid rgba(60,90,50,0.18); }
    .meals-header { padding: 13px 12px; min-height: 50px; background: #f8f6f1; }
    .meals-title {
      font-family: 'Inter', sans-serif; font-size: 15px;
      font-weight: 600; color: #1a1a1a;
    }
    .meals-tally { font-size: 13px; color: #888; }
    .meals-tally.complete { color: #2a6b38; }
    .meals-list { border-top: 1.5px solid rgba(60,90,50,0.12); padding: 6px 8px 10px; }
    .meal-item { padding: 12px 8px; min-height: 52px; border-radius: 8px; }
    .meal-brand { font-size: 11px; color: #8a6010; font-family: 'Inter', sans-serif; font-weight: 600; }
    .meal-name { font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500; color: #1a1a1a; }
    .meal-rating { font-size: 13px; color: #2a6b38; }
    .meal-item.checked .meal-name { color: #999; }
    .meal-item.checked .cb-box { background: #2a6b38; border-color: #2a6b38; }

    /* Footer */
    .footer-trees { opacity: 0.15; }
    .footer-text { color: #888; font-family: 'Inter', sans-serif; }
  }

  /* ════════════════════════════════
     TABS
  ════════════════════════════════ */
  .tab-bar {
    position: relative; z-index: 10;
    display: flex; gap: 0;
    background: #0a1509;
    border-bottom: 1px solid rgba(90,140,80,0.25);
    padding: 0 1.5rem;
  }
  .tab-btn {
    font-family: 'Inconsolata', monospace;
    font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #506b4a; background: transparent; border: none;
    padding: 14px 22px; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }
  .tab-btn:hover { color: #8fad88; }
  .tab-btn.active { color: #a8d49c; border-bottom-color: #5a8c50; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* Car Camping section colors — same dark palette */
  .cc-note {
    font-size: 12px; color: #506b4a; font-style: italic;
    padding: 1rem 0 0.25rem; letter-spacing: 0.05em;
    grid-column: 1 / -1;
  }

  @media (max-width: 640px) {
    .tab-bar {
      background: #ffffff;
      border-bottom: 2px solid rgba(60,90,50,0.15);
      padding: 0 0.5rem;
      overflow-x: auto;
    }
    .tab-btn {
      font-family: 'Inter', sans-serif;
      font-size: 13px; font-weight: 600; letter-spacing: 0.05em;
      color: #888; padding: 14px 16px; white-space: nowrap;
      border-bottom: 3px solid transparent;
    }
    .tab-btn.active { color: #2a6b38; border-bottom-color: #2a6b38; }
    .cc-note { font-family: 'Inter', sans-serif; font-size: 13px; color: #888; }
  }

</style>
</head>
<body>

<!-- ══ TAB BAR ══ -->
<nav class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('backpacking', this)">⛺ Backpacking</button>
  <button class="tab-btn" onclick="switchTab('carcamping', this)">🚙 Car Camping</button>
  <button class="tab-btn" onclick="switchTab('fishing', this)">🎣 Fishing</button>
</nav>

<!-- ══ BACKPACKING PANEL ══ -->
<div class="tab-panel active" id="panel-backpacking">
<!-- ══ HERO ══ -->

  </svg>
  <!-- Mobile hero: light dawn sky -->

let checks = {}, collapsed = {}, mealChecks = {}, mealsOpen = false;

function totalItems()   { return data.reduce((s,c)=>s+c.items.length,0) + meals.length; }
function totalChecked() { return Object.values(checks).filter(Boolean).length + Object.values(mealChecks).filter(Boolean).length; }

function updateProgress() {
  const total = totalItems(), done = totalChecked();
  const pct = total ? Math.round(done/total*100) : 0;
  document.getElementById('pbar').style.width = pct + '%';
  document.getElementById('ppct').textContent = pct + '%';
  document.getElementById('plabel').textContent = done + ' / ' + total + ' packed';
}

function mealsHTML() {
  const done = meals.filter((_,i)=>mealChecks[i]).length;
  const allDone = done === meals.length;
  return `<div class="meals-wrap">
    <div class="meals-header" onclick="toggleMeals()">
      <span style="font-size:18px">🍜</span>
      <span class="meals-title">Meals</span>
      <span class="meals-tally${allDone?' complete':''}">${done}/${meals.length}</span>
      <span class="meals-chevron${mealsOpen?' open':''}">▼</span>
    </div>
    ${mealsOpen ? `<div class="meals-list">${meals.map((m,i)=>`
      <div class="meal-item${mealChecks[i]?' checked':''}" onclick="toggleMeal(${i})">
        <div class="cb-box"></div>
        <span class="meal-brand">${m.brand}</span>
        <span class="meal-name">${m.name}</span>
        <span class="meal-rating">${m.rating}</span>
      </div>`).join('')}</div>` : ''}
  </div>`;
}

function toggleMeals() { mealsOpen = !mealsOpen; render(); }
function toggleMeal(i) { mealChecks[i] = !mealChecks[i]; render(); }

function render() {
  const cont = document.getElementById('sections');
  cont.innerHTML = '';
  data.forEach((cat, ci) => {
    const isOpen = !collapsed[ci];
    const done = cat.items.filter((_,ii) => checks[ci+'_'+ii]).length;
    const allDone = done === cat.items.length;
    const sec = document.createElement('div');
    sec.className = 'section';
    sec.style.animationDelay = (0.08 + ci * 0.07) + 's';
    sec.innerHTML = `
      <div class="section-header" onclick="toggleSection(${ci})">
        <span class="section-icon">${cat.icon}</span>
        <span class="section-name">${cat.name}</span>
        <span class="section-tally${allDone?' complete':''}">${done}/${cat.items.length}</span>
        <span class="section-chevron${isOpen?' open':''}">▼</span>
      </div>
      ${isOpen ? `<div class="items-grid">${cat.items.map((it,ii)=>{
        const id = ci+'_'+ii, checked = !!checks[id];
        return `<div class="item${checked?' checked':''}" onclick="toggle('${id}')">
          <input type="checkbox" ${checked?'checked':''}>
          <div class="cb-box"></div>
          <span class="item-label">${it.l}</span>
          ${it.o?'<span class="opt-tag">opt</span>':''}
        </div>`;
      }).join('')}${ci===6?mealsHTML():''}</div>` : ''}
    `;
    cont.appendChild(sec);
  });
  updateProgress();
}

function toggleSection(ci) { collapsed[ci] = !collapsed[ci]; render(); }
function toggle(id) { checks[id] = !checks[id]; render(); }
function resetAll() {
  if (confirm('Reset all items?')) { checks = {}; mealChecks = {}; render(); }
}

render();

/* ══════════════════════════════════
   TAB SWITCHING
══════════════════════════════════ */
function switchTab(name, btn) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'carcamping' && !window._ccRendered) { renderCC(); window._ccRendered = true; }
  if (name === 'fishing'    && !window._fishRendered) { renderFish(); window._fishRendered = true; }
}

/* ── Generic section renderer ── */
function renderSections(data, containerId, checksObj, collObj) {
  const cont = document.getElementById(containerId);
  if (!cont) return;
  cont.innerHTML = '';
  data.forEach(function(cat, ci) {
    var isOpen = !collObj[ci];
    var done = cat.items.filter(function(_,ii){ return checksObj[ci+'_'+ii]; }).length;
    var allDone = done === cat.items.length;
    var sec = document.createElement('div');
    sec.className = 'section';
    sec.style.animationDelay = (0.08 + ci * 0.07) + 's';
    var itemsHTML = '';
    if (isOpen) {
      cat.items.forEach(function(it, ii) {
        var id = ci+'_'+ii;
        var checked = !!checksObj[id];
        itemsHTML += '<div class="item' + (checked?' checked':'') + '" onclick="toggleGenericItem(event,\''+containerId+'\','+ci+','+ii+')">'
          + '<div class="cb-box"></div>'
          + '<span class="item-label">'+it.l+'</span>'
          + (it.o ? '<span class="opt-tag">opt</span>' : '')
          + '</div>';
      });
    }
    sec.innerHTML = '<div class="section-header" onclick="toggleGenericSection(event,\''+containerId+'\','+ci+')">'
      + '<span class="section-icon">'+cat.icon+'</span>'
      + '<span class="section-name">'+cat.name+'</span>'
      + '<span class="section-tally'+(allDone?' complete':'')+'">'+done+'/'+cat.items.length+'</span>'
      + '<span class="section-chevron'+(isOpen?' open':'')+'">▼</span>'
      + '</div>'
      + (isOpen ? '<div class="items-grid">'+itemsHTML+'</div>' : '');
    cont.appendChild(sec);
  });
}

function getCtx(containerId) {
  if (containerId === 'cc-sections')   return { data: ccData,   checks: window.ccChecks,   coll: window.ccColl };
  if (containerId === 'fish-sections') return { data: fishData, checks: window.fishChecks, coll: window.fishColl };
  return null;
}

function toggleGenericSection(e, containerId, ci) {
  e.stopPropagation();
  var ctx = getCtx(containerId);
  ctx.coll[ci] = !ctx.coll[ci];
  renderSections(ctx.data, containerId, ctx.checks, ctx.coll);
}

function toggleGenericItem(e, containerId, ci, ii) {
  e.stopPropagation();
  var ctx = getCtx(containerId);
  var id = ci+'_'+ii;
  ctx.checks[id] = !ctx.checks[id];
  renderSections(ctx.data, containerId, ctx.checks, ctx.coll);
}

window.ccChecks = {}; window.ccColl = {};
window.fishChecks = {}; window.fishColl = {};
window.ccData = ccData;
window.fishData = fishData;

function renderCC()   { renderSections(ccData,   "cc-sections",   window.ccChecks,   window.ccColl); }
function renderFish() { renderSections(fishData, "fish-sections", window.fishChecks, window.fishColl); }
